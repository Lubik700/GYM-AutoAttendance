{% extends 'app/base.html' %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-dark-card border border-white/5 rounded-2xl p-8">
        <h1 class="font-display text-xl font-semibold text-white mb-2">Reset your password</h1>
        <p class="text-gray-400 text-sm mb-6">Enter your email and we'll send you a link to reset your password.</p>
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {{ form.email }}
            {% if form.email.errors %}<p class="mt-1.5 text-xs text-red-400">{{ form.email.errors.0 }}</p>{% endif %}
            <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-semibold py-3 rounded-xl transition-colors">
                Send Reset Link
            </button>
        </form>
    </div>
</div>
{% endblock %}
