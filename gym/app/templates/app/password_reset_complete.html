{% extends 'app/base.html' %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-dark-card border border-white/5 rounded-2xl p-8">
        <h1 class="font-display text-xl font-semibold text-white mb-2">Password reset complete</h1>
        <p class="text-gray-400 text-sm mb-6">You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="inline-block bg-primary hover:bg-primary-hover text-white font-medium px-6 py-2.5 rounded-xl transition-colors">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
