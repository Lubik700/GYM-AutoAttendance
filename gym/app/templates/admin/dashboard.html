{% extends 'admin/base.html' %}
{% block content %}
<h1 class="font-display text-2xl font-bold mb-6">Dashboard</h1>
<div class="grid grid-cols-3 gap-5">
    <div class="bg-dark-card rounded-2xl p-6 border border-white/5">
        <p class="text-gray-400 text-sm">Pending Registrations</p>
        <p class="text-3xl font-bold text-primary mt-1">{{ pending_count }}</p>
    </div>
    <div class="bg-dark-card rounded-2xl p-6 border border-white/5">
        <p class="text-gray-400 text-sm">Active Members</p>
        <p class="text-3xl font-bold text-success mt-1">{{ active_members }}</p>
    </div>
    <div class="bg-dark-card rounded-2xl p-6 border border-white/5">
        <p class="text-gray-400 text-sm">Total Notices</p>
        <p class="text-3xl font-bold text-white mt-1">{{ total_notices }}</p>
    </div>
</div>
{% endblock %}
