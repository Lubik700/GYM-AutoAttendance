{% extends 'adminpanel/base.html' %}
{% block content %}
<div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <h1 class="font-display text-2xl font-bold">Membership Packages</h1>
    <div class="flex items-center gap-3">
        <form method="get" class="flex">
            <input type="text" name="q" value="{{ query }}" placeholder="Search by name"
                   class="admin-input w-64 text-sm">
        </form>
        <a href="{% url 'admin_package_add' %}" class="bg-primary hover:bg-red-600 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition-colors whitespace-nowrap">
            + Add Package
        </a>
    </div>
</div>




<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    {% for pkg in packages %}
    <div class="bg-dark-card border border-white/5 rounded-2xl p-5">
        <h3 class="text-white font-semibold mb-1">{{ pkg.name }}</h3>
        <p class="text-2xl font-bold text-primary mb-1">Rs. {{ pkg.price }}</p>
        <p class="text-xs text-gray-500 mb-4">{{ pkg.duration_days }} days</p>
        <div class="flex gap-2">
            <a href="{% url 'admin_package_edit' pkg.id %}" class="text-xs text-gray-300 hover:text-primary">Edit</a>
            <a href="{% url 'admin_package_delete' pkg.id %}" onclick="return confirm('Delete this package?');" class="text-xs text-red-400 hover:text-red-300">Delete</a>
        </div>
    </div>
    {% empty %}
    <p class="text-gray-500 text-sm">No packages yet.</p>
    {% endfor %}
</div>
{% endblock %}
