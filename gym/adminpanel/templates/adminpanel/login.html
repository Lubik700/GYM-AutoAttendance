{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | FitTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#2A2A2A] rounded-2xl border border-white/5 p-8 w-full max-w-sm">
        <h1 class="text-xl font-bold text-white mb-6 text-center">FitTrack Admin</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 px-4 py-3 rounded-lg text-sm bg-red-500/15 text-red-400 border border-red-500/30">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required
                   class="w-full bg-[#121212] border border-[#424242] text-white rounded-xl px-4 py-2.5 text-sm">
            <input type="password" name="password" placeholder="Password" required
                   class="w-full bg-[#121212] border border-[#424242] text-white rounded-xl px-4 py-2.5 text-sm">
            <button type="submit" class="w-full bg-[#E53935] hover:bg-red-600 text-white font-semibold py-2.5 rounded-xl transition-colors">
                Login
            </button>
        </form>
    </div>
</body>
</html>
